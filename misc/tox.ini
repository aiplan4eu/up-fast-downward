# Test environments:
#
#   release
#     Builds the checkout into a wheel and installs it like a user would get
#     it. Slow: Fast Downward is cloned and compiled whenever the sources
#     changed. Use this for CI and before releases.
#   dev
#     Editable install of the checkout. Changes to the Python files take effect
#     immediately. Fast Downward is compiled only once, when the environment is
#     created. Use this while developing.
#   unified-planning
#     Baseline: tests the up-fast-downward release from PyPI, NOT this
#     checkout.
#
# Usage:
#   tox                  run the envs in envlist (release, dev, unified-planning)
#   tox -e dev           run a single env
#
# When is -r (recreate the environment) needed?
#   release  Normally never: the package is rebuilt and reinstalled when
#            the sources changed.
#   dev      Not after editing Python files. Use "tox -r -e dev" after
#            changes to the build (pyproject.toml, _custom_build.py, the
#            pinned Fast Downward version), since those are not rerun by an
#            editable install.

[tox]
envlist = release, dev, unified-planning
package_root = {toxinidir}/..
skip_missing_interpreters = true

[testenv]
basepython = python3
changedir = {toxinidir}/tests/
deps =
  pytest
  unified-planning >= 1.1.0
commands =
  pytest test-simple.py

[testenv:unified-planning]
# Uses the up-fast-downward package from pypi.
package = skip
deps =
  {[testenv]deps}
  up-fast-downward

[testenv:release]
package = wheel

[testenv:dev]
# Editable install.
package = skip
deps =
  {[testenv]deps}
  -e {toxinidir}/..
